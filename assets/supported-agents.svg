<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="180" fill="none">
  <defs>
    <linearGradient id="gridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#141419"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c24"/>
      <stop offset="100%" stop-color="#121217"/>
    </linearGradient>
  </defs>

  <rect width="880" height="180" rx="14" fill="url(#gridBg)" stroke="#27272a" stroke-width="1"/>

  <!-- Header -->
  <text x="32" y="38" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">SUPPORTED AI RUNNERS &amp; AGENTS</text>
  <line x1="32" y1="50" x2="848" y2="50" stroke="#27272a" stroke-width="1"/>

  <!-- Row 1: 4 Agents -->
  <!-- 1. Antigravity (agy) -->
  <g transform="translate(32, 64)">
    <rect width="190" height="46" rx="8" fill="url(#cardGrad)" stroke="#3f3f46" stroke-width="1"/>
    <!-- Stylized agy icon -->
    <circle cx="25" cy="23" r="11" fill="#2563eb" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M 20 26 L 25 18 L 30 26 Z" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="46" y="22" fill="#fafafa" font-family="Inter, sans-serif" font-size="13" font-weight="600">Antigravity</text>
    <text x="46" y="36" fill="#71717a" font-family="monospace" font-size="11">agy / gemini</text>
  </g>

  <!-- 2. Claude Code -->
  <g transform="translate(236, 64)">
    <rect width="190" height="46" rx="8" fill="url(#cardGrad)" stroke="#3f3f46" stroke-width="1"/>
    <!-- Stylized Claude icon -->
    <circle cx="25" cy="23" r="11" fill="#d97706" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M 21 27 C 21 21 29 21 29 27" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
    <circle cx="25" cy="18" r="2" fill="#fbbf24"/>
    <text x="46" y="22" fill="#fafafa" font-family="Inter, sans-serif" font-size="13" font-weight="600">Claude Code</text>
    <text x="46" y="36" fill="#71717a" font-family="monospace" font-size="11">claude / desktop</text>
  </g>

  <!-- 3. Cursor -->
  <g transform="translate(440, 64)">
    <rect width="190" height="46" rx="8" fill="url(#cardGrad)" stroke="#3f3f46" stroke-width="1"/>
    <!-- Cursor arrow icon -->
    <circle cx="25" cy="23" r="11" fill="#7c3aed" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1.5"/>
    <path d="M 20 18 L 29 23 L 24 24 L 22 28 Z" fill="#a78bfa"/>
    <text x="46" y="22" fill="#fafafa" font-family="Inter, sans-serif" font-size="13" font-weight="600">Cursor</text>
    <text x="46" y="36" fill="#71717a" font-family="monospace" font-size="11">cursor mcp</text>
  </g>

  <!-- 4. OpenCode -->
  <g transform="translate(644, 64)">
    <rect width="190" height="46" rx="8" fill="url(#cardGrad)" stroke="#3f3f46" stroke-width="1"/>
    <!-- Terminal icon -->
    <circle cx="25" cy="23" r="11" fill="#059669" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
    <path d="M 21 19 L 25 23 L 21 27" stroke="#34d399" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="46" y="22" fill="#fafafa" font-family="Inter, sans-serif" font-size="13" font-weight="600">OpenCode</text>
    <text x="46" y="36" fill="#71717a" font-family="monospace" font-size="11">opencode run</text>
  </g>

  <!-- Row 2: 4 More Agents -->
  <!-- 5. Pi Agent -->
  <g transform="translate(32, 118)">
    <rect width="190" height="46" rx="8" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1"/>
    <circle cx="25" cy="23" r="11" fill="#ec4899" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1.5"/>
    <path d="M 20 20 H 30 M 23 20 V 27 M 27 20 V 27" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round"/>
    <text x="46" y="22" fill="#fafafa" font-family="Inter, sans-serif" font-size="13" font-weight="600">Pi Agent</text>
    <text x="46" y="36" fill="#71717a" font-family="monospace" font-size="11">pi --tools</text>
  </g>

  <!-- 6. Codex CLI -->
  <g transform="translate(236, 118)">
    <rect width="190" height="46" rx="8" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1"/>
    <circle cx="25" cy="23" r="11" fill="#0284c7" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="20" y="18" width="10" height="10" rx="2" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <text x="46" y="22" fill="#fafafa" font-family="Inter, sans-serif" font-size="13" font-weight="600">Codex CLI</text>
    <text x="46" y="36" fill="#71717a" font-family="monospace" font-size="11">codex exec</text>
  </g>

  <!-- 7. Cline / VS Code -->
  <g transform="translate(440, 118)">
    <rect width="190" height="46" rx="8" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1"/>
    <circle cx="25" cy="23" r="11" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1.5"/>
    <path d="M 21 21 L 25 25 L 29 21" stroke="#818cf8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="46" y="22" fill="#fafafa" font-family="Inter, sans-serif" font-size="13" font-weight="600">Cline / Roo</text>
    <text x="46" y="36" fill="#71717a" font-family="monospace" font-size="11">vscode mcp</text>
  </g>

  <!-- 8. GitHub Copilot -->
  <g transform="translate(644, 118)">
    <rect width="190" height="46" rx="8" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1"/>
    <circle cx="25" cy="23" r="11" fill="#64748b" fill-opacity="0.15" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="1.5" fill="#e2e8f0"/>
    <circle cx="28" cy="22" r="1.5" fill="#e2e8f0"/>
    <path d="M 21 26 Q 25 28 29 26" stroke="#e2e8f0" stroke-width="1.2" fill="none"/>
    <text x="46" y="22" fill="#fafafa" font-family="Inter, sans-serif" font-size="13" font-weight="600">Copilot CLI</text>
    <text x="46" y="36" fill="#71717a" font-family="monospace" font-size="11">copilot -p</text>
  </g>
</svg>
