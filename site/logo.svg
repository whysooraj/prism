<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Dark subtle background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#121217"/>
    </linearGradient>

    <!-- Refraction beams -->
    <linearGradient id="beamIn" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#71717a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#e4e4e7" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="beam1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="beam2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="beam3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="beam4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glass facet reflection -->
    <linearGradient id="glassFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="240" rx="16" fill="url(#bgGrad)"/>
  <rect width="800" height="240" rx="16" stroke="#27272a" stroke-width="1"/>

  <!-- Left: Prism Symbol (Center ~ x:140, y:120) -->
  <g id="prism-mark" transform="translate(14, 0)">
    <!-- Incident raw information beam -->
    <path d="M 30 120 L 130 120" stroke="url(#beamIn)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Dispersed structured context rays -->
    <!-- Ray 1: Layout / Box Model -->
    <path d="M 175 110 L 255 75" stroke="url(#beam1)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="255" cy="75" r="2" fill="#60a5fa"/>

    <!-- Ray 2: Tokens / WCAG Palette -->
    <path d="M 180 118 L 265 105" stroke="url(#beam2)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="265" cy="105" r="2" fill="#34d399"/>

    <!-- Ray 3: AST Symbols -->
    <path d="M 180 125 L 265 135" stroke="url(#beam3)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="265" cy="135" r="2" fill="#818cf8"/>

    <!-- Ray 4: Call Graphs & Routes -->
    <path d="M 175 132 L 255 165" stroke="url(#beam4)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="255" cy="165" r="2" fill="#fbbf24"/>

    <!-- Prism Triangular Body -->
    <!-- Back shadow triangle -->
    <polygon points="150,55 90,175 210,175" fill="url(#glassFacet)" stroke="#3f3f46" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Internal refractive core -->
    <polygon points="150,75 108,165 192,165" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Front glass edge highlight -->
    <line x1="150" y1="55" x2="90" y2="175" stroke="#fafafa" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>

  <!-- Right: Typography & Hierarchy -->
  <g id="brand-typography" transform="translate(305, 75)">
    <!-- Main Title -->
    <text x="0" y="48" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.5">PRISM</text>

    <!-- Category Pill Badge -->
    <rect x="175" y="16" width="105" height="24" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="227" y="32" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="middle">MCP SERVER</text>

    <!-- Subtitle / Mission -->
    <text x="2" y="78" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" font-weight="400" letter-spacing="-0.2">AI Context Infrastructure for Websites &amp; Repositories</text>

    <!-- Feature tags -->
    <g transform="translate(2, 98)">
      <text x="0" y="14" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">DOM BOX-MODEL</text>
      <circle cx="106" cy="10" r="2" fill="#3f3f46"/>
      <text x="118" y="14" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">AST SYMBOLS</text>
      <circle cx="206" cy="10" r="2" fill="#3f3f46"/>
      <text x="218" y="14" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">CALL GRAPHS</text>
      <circle cx="304" cy="10" r="2" fill="#3f3f46"/>
      <text x="316" y="14" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">ZERO TOKENS WASTED</text>
    </g>
  </g>
</svg>
